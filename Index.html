<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishna Gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --beige:#EFE6D2;
    --beige-deep:#E3D6B8;
    --white:#FFFDF8;
    --maroon:#6E1423;
    --maroon-soft:#8C2233;
    --gold:#B8892B;
    --gold-soft:#C9A24B;
    --text:#4A3325;
    --muted:#95826B;
    --line: rgba(110,20,35,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -10%, var(--white) 0%, var(--beige) 45%, var(--beige-deep) 100%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:60px 20px 44px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--white);
    border:1px solid var(--beige-deep);
    border-radius:4px;
    padding:44px 34px 36px;
    box-shadow: 0 24px 60px -30px rgba(110,20,35,0.25);
  }

  .mark{
    width:76px;height:76px;
    margin:0 auto 24px;
    border-radius:50%;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    box-shadow:0 6px 18px -6px rgba(110,20,35,0.4);
  }
  .mark::before{
    content:"";
    position:absolute;
    inset:-6px;
    border:1px solid rgba(184,137,43,0.35);
    border-radius:50%;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:42px;
    text-align:center;
    margin:0 0 6px;
    letter-spacing:0.5px;
    color:var(--maroon);
  }

  .tagline{
    text-align:center;
    color:var(--muted);
    font-size:14.5px;
    margin:0 0 44px;
    line-height:1.5;
    letter-spacing:0.3px;
  }

  .links{
    border-top:1px solid var(--line);
  }

  .links a{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:19px 4px;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:var(--text);
    font-size:16.5px;
    font-weight:500;
    font-family:'Cormorant Garamond', serif;
    transition:color .15s ease, padding-left .15s ease;
  }

  .links a:hover{
    color:var(--maroon);
    padding-left:10px;
  }

  .links a .arrow{
    color:var(--gold);
    font-family:'Cormorant Garamond', serif;
    font-size:20px;
    transition:transform .15s ease, color .15s ease;
  }
  .links a:hover .arrow{
    color:var(--maroon);
    transform:translateX(3px);
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    margin-top:36px;
    letter-spacing:0.4px;
  }

  .contact{
    border-bottom:1px solid var(--line);
  }
  .contact summary{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:19px 4px;
    cursor:pointer;
    color:var(--text);
    font-size:16.5px;
    font-weight:500;
    font-family:'Cormorant Garamond', serif;
    list-style:none;
    transition:color .15s ease, padding-left .15s ease;
  }
  .contact summary::-webkit-details-marker{ display:none; }
  .contact summary:hover{
    color:var(--maroon);
    padding-left:10px;
  }
  .contact summary:hover .arrow{
    color:var(--maroon);
  }
  .contact[open] summary .arrow{
    transform:rotate(90deg);
    color:var(--maroon);
  }
  .contact summary .arrow{
    color:var(--gold);
    font-family:'Cormorant Garamond', serif;
    font-size:20px;
    transition:transform .15s ease, color .15s ease;
  }

  .contact-items{
    padding:0 4px 18px 4px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .contact-items a{
    color:var(--muted);
    text-decoration:none;
    font-size:14.5px;
    font-family:'Inter', sans-serif;
    padding-left:4px;
    border-left:2px solid var(--gold);
    padding-left:12px;
    transition:color .15s ease;
  }
  .contact-items a:hover{
    color:var(--maroon);
  }

  /* --- QR section --- */
  .qr-block{
    margin-top:56px;
    padding-top:32px;
    border-top:1px solid var(--line);
    text-align:center;
  }

  .qr-block h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:20px;
    margin:0 0 6px;
    color:var(--maroon);
  }

  .qr-block p{
    color:var(--muted);
    font-size:13px;
    margin:0 0 20px;
    line-height:1.5;
  }

  .qr-input{
    width:100%;
    padding:12px 14px;
    background:var(--beige);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    margin-bottom:18px;
  }
  .qr-input:focus{
    outline:none;
    border-color:var(--gold);
  }

  .qr-img-wrap{
    background:var(--white);
    border:1px solid var(--beige-deep);
    padding:16px;
    border-radius:8px;
    display:inline-block;
  }
  .qr-img-wrap img{
    display:block;
    width:200px;
    height:200px;
  }

  .qr-actions{
    margin-top:16px;
  }
  .qr-actions a{
    color:var(--maroon);
    font-size:13px;
    text-decoration:none;
    border-bottom:1px solid var(--gold);
    padding-bottom:2px;
  }
</style>
</head>
